  <path d="M23 30 8 21m33 10 13-13" fill="none" stroke="#F6E7C4" stroke-width="5" stroke-linecap="round"/>
  <path d="M21 39h22" fill="none" stroke="#E8C14A" stroke-width="4" stroke-linecap="round"/>
  <path d="m27 48-7 11m17-11 7 10" fill="none" stroke="#F6E7C4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="29" cy="16" r="1.2" fill="#DARK"/>
